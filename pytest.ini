[pytest]
markers =
    e2e: End-to-end tests with LLM judge (requires API keys)
    slow: Slow running tests
    integration: Integration tests
    unit: Unit tests
    async: Async tests

testpaths = 
    BR0
    BR1
    BR2
    BR3
    BR4
    BR5
    BR6
    BR7
    BR8
    BR9
    BR10

python_files = 
    test_*.py
    *_test.py

python_classes = 
    Test*
    *Test

python_functions = 
    test_*

addopts = 
    -v
    --tb=short
    --strict-markers

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning